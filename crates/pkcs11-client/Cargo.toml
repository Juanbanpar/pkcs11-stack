[package]
name = "pkcs11-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
description = "Token-backed cryptography, certificate binding, and object management for Rust applications"
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/pkcs11-client"
keywords = ["pkcs11", "cryptography", "hsm", "security"]
categories = ["cryptography", "hardware-support"]
include = ["src/**", "tests/**", "examples/**", "README.md", "Cargo.toml", "Cargo.lock", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
pkcs11-runtime.workspace = true
pkcs11-locator.workspace = true
thiserror.workspace = true
x509-cert.workspace = true
rsa.workspace = true
p256.workspace = true
p384.workspace = true
p521.workspace = true
ed25519-dalek.workspace = true
ed448-goldilocks-plus = { workspace = true, features = ["signing"] }
ml-dsa.workspace = true
sha2.workspace = true
sha1.workspace = true

[dev-dependencies]
zeroize.workspace = true

[lints]
workspace = true
