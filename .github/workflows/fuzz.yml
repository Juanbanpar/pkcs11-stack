name: Fuzz

on:
  pull_request:
    paths-ignore:
      - 'docs/**.md'
      - '*.md'
      - 'tests/README.md'
      - 'fuzz/README.md'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned fuzz tooling
        run: |
          rustup toolchain install nightly-2026-09-25 --profile minimal --component rust-src --no-self-update
          cargo +nightly-2026-09-25 install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz URI, selectors, encodings and application parsers with AddressSanitizer
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '5' || '120' }}
        run: bash tools/test-fuzz.sh
      - name: Preserve crashes and generated corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-and-artifacts
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore
