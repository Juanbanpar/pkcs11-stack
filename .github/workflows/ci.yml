name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PROPTEST_CASES: "256"
  PROPTEST_RNG_SEED: "20260927"

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --no-self-update --profile minimal
          rustup default stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit workspace, fuzz and pinned provider lockfiles
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file fuzz/Cargo.lock
          (cd tools/provider-locks && cargo audit --file kryoptic.Cargo.lock)
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake pkg-config libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --no-self-update --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Adapter production feature configurations
        run: |
          cargo check -p pkcs11-rustls-adapter --lib --no-default-features --locked
          cargo check -p pkcs11-rustls-adapter --lib --features tls12 --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and documentation tests
        run: cargo test --workspace --locked
      - name: Rustdoc warnings
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
      - name: Preserve property regressions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: property-regressions-linux
          path: |
            **/proptest-regressions/**
            **/*.proptest-regressions
          if-no-files-found: ignore
  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --no-self-update --profile minimal
          rustup default stable
      - name: Compile all targets and check CLI file handling
        run: |
          cargo check --workspace --all-targets --locked
          cargo test -p pkcs11ctl --test cli --locked -- preserves
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake
      - name: Install minimum Rust
        run: rustup toolchain install 1.85.0 --no-self-update --profile minimal
      - name: Check minimum Rust
        run: cargo +1.85.0 check --workspace --exclude pkcs11-desktop --all-targets --locked

  desktop-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Install desktop minimum Rust
        run: rustup toolchain install 1.88.0 --no-self-update --profile minimal
      - name: Check desktop minimum Rust
        run: cargo +1.88.0 check -p pkcs11-desktop --all-targets --locked

  softhsm-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [packaged, upstream]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --no-self-update --profile minimal
          rustup default stable
      - name: Install software token
        run: |
          sudo apt-get update
          sudo apt-get install --yes softhsm2 openssl opensc
      - name: Build upstream SoftHSM with multipart ECDSA and ML-DSA
        if: matrix.provider == 'upstream'
        run: |
          sudo apt-get install --yes autoconf automake libtool g++ make perl pkg-config
          prefix="$RUNNER_TEMP/softhsm-upstream"
          bash tools/build-pqc-softhsm.sh "$prefix"
          printf '%s\n' \
            "PKCS11_TEST_MODULE=$prefix/lib/softhsm/libsofthsm2.so" \
            "SOFTHSM2_UTIL=$prefix/bin/softhsm2-util" \
            "PKCS11_TEST_PQC_OPENSSL=$prefix/openssl/bin/openssl" \
            'PKCS11_TEST_REQUIRE_EC_MULTIPART=1' \
            'PKCS11_TEST_REQUIRE_RSA_OAEP_SHA2=1' >> "$GITHUB_ENV"
      - name: Install desktop native dependencies
        run: |
          sudo apt-get install --yes cmake pkg-config libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Isolated runtime, client, CLI, TLS and desktop workflows
        env:
          # SoftHSM 2.6.1 reports encoded-byte EdDSA bounds instead of field bits.
          # Upstream retains mandatory Ed25519/Ed448 coverage.
          PKCS11_TEST_SKIP_EDDSA: ${{ matrix.provider == 'packaged' && '1' || '0' }}
        run: ./tools/test-softhsm.sh
      - name: ML-DSA library, CLI, TLS and desktop workflows
        if: matrix.provider == 'upstream'
        run: ./tools/test-ml-dsa.sh

  kryoptic-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and provider build dependencies
        run: |
          rustup toolchain install stable --no-self-update --profile minimal
          rustup default stable
          rustup toolchain install 1.99.0 --no-self-update --profile minimal
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev pkg-config libsqlite3-dev g++ make perl opensc libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Build pinned Kryoptic and OpenSSL
        run: ./tools/build-kryoptic-provider.sh "$RUNNER_TEMP/kryoptic"
      - name: Run isolated KEM, derivation, PQC signing and Montgomery suites
        env:
          PKCS11_TEST_KRYOPTIC_MODULE: ${{ runner.temp }}/kryoptic/libkryoptic_pkcs11.so
          PKCS11_TEST_KRYOPTIC_OPENSSL: ${{ runner.temp }}/kryoptic/openssl/bin/openssl
        run: ./tools/test-kryoptic.sh
