name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PROPTEST_CASES: "256"
  PROPTEST_RNG_SEED: "20260927"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake pkg-config libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --no-self-update --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Adapter production feature configurations
        run: |
          cargo check -p pkcs11-rustls-adapter --lib --no-default-features --locked
          cargo check -p pkcs11-rustls-adapter --lib --features tls12 --locked
      - name: Dependency boundaries
        run: python3 tools/check-dependencies.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and documentation tests
        run: cargo test --workspace --locked
      - name: Preserve property regressions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: property-regressions-linux
          path: |
            **/proptest-regressions/**
            **/*.proptest-regressions
          if-no-files-found: ignore
  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --no-self-update --profile minimal
          rustup default stable
      - name: Check and test without a provider module
        run: |
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo check -p pkcs11-rustls-adapter --lib --no-default-features --locked
          cargo check -p pkcs11-rustls-adapter --lib --features tls12 --locked
      - name: Preserve property regressions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: property-regressions-${{ matrix.os }}
          path: |
            **/proptest-regressions/**
            **/*.proptest-regressions
          if-no-files-found: ignore
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned fuzz tooling
        run: |
          rustup toolchain install nightly-2026-09-25 --profile minimal --component rust-src --no-self-update
          cargo +nightly-2026-09-25 install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz parser, selectors and ECDSA encoding with AddressSanitizer
        run: bash tools/test-fuzz.sh
      - name: Preserve crashes and generated corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-and-artifacts
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore
  independent-crates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [pkcs11-locator, pkcs11-runtime, pkcs11-client, pkcs11ctl, pkcs11-rustls-adapter, pkcs11-desktop]
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop native dependencies
        if: matrix.crate == 'pkcs11-desktop'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --no-self-update --profile minimal
          rustup default stable
      - name: Install adapter test build dependencies
        if: matrix.crate == 'pkcs11-rustls-adapter'
        run: sudo apt-get update && sudo apt-get install --yes cmake
      - name: Check and test one crate without sibling feature unification
        run: |
          cargo check -p ${{ matrix.crate }} --all-targets --locked
          cargo test -p ${{ matrix.crate }} --locked
      - name: Preserve property regressions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: property-regressions-${{ matrix.crate }}
          path: |
            **/proptest-regressions/**
            **/*.proptest-regressions
          if-no-files-found: ignore
  msrv:
    runs-on: ubuntu-latest
    env:
      PROPTEST_RNG_SEED: "20260928"
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake
      - name: Install minimum Rust
        run: rustup toolchain install 1.85.0 --no-self-update --profile minimal
      - name: Check minimum Rust
        run: cargo +1.85.0 check --workspace --exclude pkcs11-desktop --all-targets --locked
      - name: Test minimum Rust
        run: cargo +1.85.0 test --workspace --exclude pkcs11-desktop --locked
      - name: Preserve property regressions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: property-regressions-msrv
          path: |
            **/proptest-regressions/**
            **/*.proptest-regressions
          if-no-files-found: ignore

  desktop-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Install desktop minimum Rust
        run: rustup toolchain install 1.88.0 --no-self-update --profile minimal
      - name: Check and test desktop minimum Rust
        run: |
          cargo +1.88.0 check -p pkcs11-desktop --all-targets --locked
          cargo +1.88.0 test -p pkcs11-desktop --locked

  softhsm-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [packaged, multipart]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --no-self-update --profile minimal
          rustup default stable
      - name: Install software token
        run: |
          sudo apt-get update
          sudo apt-get install --yes softhsm2 openssl opensc
      - name: Build pinned upstream SoftHSM with multipart ECDSA
        if: matrix.provider == 'multipart'
        run: |
          sudo apt-get install --yes autoconf automake libtool g++ libssl-dev
          source_dir="$RUNNER_TEMP/softhsm-source"
          prefix="$RUNNER_TEMP/softhsm-multipart"
          git init "$source_dir"
          git -C "$source_dir" fetch --depth 1 https://github.com/softhsm/SoftHSMv2.git 884cb38f3d2012a0447bd5f50dbd29c429987c41
          git -C "$source_dir" checkout --detach FETCH_HEAD
          cd "$source_dir"
          sh autogen.sh
          ./configure --prefix="$prefix" --with-crypto-backend=openssl --disable-gost
          make -j2
          make install
          echo "PKCS11_TEST_MODULE=$prefix/lib/softhsm/libsofthsm2.so" >> "$GITHUB_ENV"
          echo "SOFTHSM2_UTIL=$prefix/bin/softhsm2-util" >> "$GITHUB_ENV"
          echo 'PKCS11_TEST_REQUIRE_EC_MULTIPART=1' >> "$GITHUB_ENV"
          echo 'PKCS11_TEST_REQUIRE_RSA_OAEP_SHA2=1' >> "$GITHUB_ENV"
      - name: Install desktop native dependencies
        run: |
          sudo apt-get install --yes cmake pkg-config libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Isolated runtime, client, CLI, TLS and desktop workflows
        env:
          PKCS11_TEST_DESKTOP: "1"
        run: ./tools/test-softhsm.sh

  pqc-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and provider build dependencies
        run: |
          rustup toolchain install stable --no-self-update --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes cmake autoconf automake libtool g++ make perl openssl opensc
      - name: Build pinned OpenSSL and SoftHSM with required PQC support
        run: bash tools/build-pqc-softhsm.sh "$RUNNER_TEMP/softhsm-pqc"
      - name: Require ML-DSA and ML-KEM execution alongside classical workflows
        env:
          PKCS11_TEST_REQUIRE_PQC: "1"
          PKCS11_TEST_PQC_OPENSSL: ${{ runner.temp }}/softhsm-pqc/openssl/bin/openssl
          PKCS11_TEST_MODULE: ${{ runner.temp }}/softhsm-pqc/lib/softhsm/libsofthsm2.so
          SOFTHSM2_UTIL: ${{ runner.temp }}/softhsm-pqc/bin/softhsm2-util
        run: ./tools/test-softhsm.sh

  hkdf-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and NSS softoken
        run: |
          rustup toolchain install stable --no-self-update --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes libnss3
      - name: Check RFC 5869 with nonextractable session keys
        run: ./tools/test-hkdf.sh

  kem-hkdf-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and provider build dependencies
        run: |
          rustup toolchain install stable --no-self-update --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev pkg-config libsqlite3-dev g++ make perl openssl
      - name: Build pinned Kryoptic and OpenSSL with ML-KEM, ECDH and HKDF
        run: ./tools/build-kem-hkdf-provider.sh "$RUNNER_TEMP/kdf-provider"
      - name: Require typed HKDF, hybrid and CLI key establishment on the same token
        env:
          PKCS11_TEST_KDF_MODULE: ${{ runner.temp }}/kdf-provider/libkryoptic_pkcs11.so
        run: ./tools/test-kem-hkdf.sh
