[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/pkcs11-locator",
    "crates/pkcs11-runtime",
    "crates/pkcs11-client",
    "crates/pkcs11-rustls-adapter",
    "crates/pkcs11ctl",
    "crates/pkcs11-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/Juanbanpar/pkcs11-stack"

[workspace.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "wayland", "advanced", "linux-theme-detection"] }
pkcs11-locator = { path = "crates/pkcs11-locator", version = "0.1.0" }
pkcs11-runtime = { path = "crates/pkcs11-runtime", version = "0.1.0" }
pkcs11-client = { path = "crates/pkcs11-client", version = "0.1.0" }
serde_json = "1.0.154"
cryptoki = "0.12.1"
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
rustls-pki-types = "1.16.0"
rustls-webpki = { version = "0.103.17", default-features = false, features = ["std"] }
secrecy = "0.10.3"
zeroize = "1.9.2"
sha2 = "0.11.1"
sha1 = "0.11.0"
thiserror = "2.0.21"
clap = "4.6.8"
x509-cert = { version = "0.3.0", default-features = false, features = ["std"] }
rsa = { version = "0.10.0", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
ed448-goldilocks-plus = { version = "0.18.1", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "5.0.0", default-features = false }
ml-dsa = { version = "0.1.2", default-features = false, features = ["alloc"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
der = { version = "0.8.3", features = ["std", "derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
